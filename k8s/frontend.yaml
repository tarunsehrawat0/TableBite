apiVersion: apps/v1
kind: Deployment
metadata:
  name: tablebite-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tablebite-frontend
  template:
    metadata:
      labels:
        app: tablebite-frontend
    spec:
      containers:
        - name: frontend
          image: tablebite-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tablebite-frontend
spec:
  type: ClusterIP
  selector:
    app: tablebite-frontend
  ports:
    - port: 80
      targetPort: 80
