apiVersion: apps/v1
kind: Deployment
metadata:
	name: tablebite-frontend
spec:
	replicas: 2
	strategy:
		type: RollingUpdate
		rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
	selector:
		matchLabels: { app: tablebite-frontend }
	template:
		metadata:
			labels: { app: tablebite-frontend }
		spec:
			containers:
				- name: frontend
					image: YOUR_DOCKERHUB_USER/tablebite-frontend:latest
					ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
	name: tablebite-frontend
spec:
	type: LoadBalancer
	selector: { app: tablebite-frontend }
	ports: [{ port: 80, targetPort: 80 }]
