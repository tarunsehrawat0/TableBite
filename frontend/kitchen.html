<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TableBite Kitchen</title>
  <style>
    :root { color-scheme:dark; --bg:#17231c; --card:#24372b; --line:#3c5543; --ink:#f8f4ea; --muted:#cbd6cb; --accent:#f5af62; }
    * { box-sizing:border-box; } body { margin:0; background:radial-gradient(circle at 90% 0,#3b5942 0,transparent 35%),var(--bg); color:var(--ink); font:16px ui-sans-serif,system-ui; }
    .shell { max-width:980px; margin:auto; padding:32px 18px; } .top { display:flex; align-items:end; justify-content:space-between; gap:20px; } .tag { color:var(--accent); font-size:.75rem; text-transform:uppercase; font-weight:800; letter-spacing:.08em; } h1 { margin:5px 0 0; font-size:clamp(2rem,5vw,3.2rem); } .tools { display:flex; gap:8px; align-items:center; } input,button { min-height:40px; border-radius:8px; border:1px solid var(--line); font:inherit; } input { width:180px; padding:0 12px; background:var(--card); color:var(--ink); } button { padding:0 14px; background:var(--accent); color:#17231c; font-weight:800; cursor:pointer; } .orders { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; margin-top:28px; } .order { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; } .order h2 { margin:5px 0 8px; text-transform:capitalize; } .customer { color:var(--muted); font-size:13px; } .order ul { padding-left:20px; color:var(--muted); } .actions { display:flex; flex-wrap:wrap; gap:7px; } .actions button { min-height:34px; padding:0 12px; } .empty { color:var(--muted); }
  </style>
</head>
<body><main class="shell"><header class="top"><div><div class="tag">Back of house</div><h1>Kitchen queue</h1></div><div class="tools"><input id="adminKey" type="password" value="dev-admin-key" aria-label="Kitchen admin key" placeholder="Admin key"><button id="refresh">Refresh</button></div></header><section class="orders" id="orders"></section></main>
<script>
const statuses=['confirmed','received','preparing','ready','served']; const ordersNode=document.getElementById('orders'); const keyNode=document.getElementById('adminKey');
async function load(){const response=await fetch('/api/orders');if(!response.ok){ordersNode.innerHTML='<p class="empty">Could not load orders.</p>';return;}const orders=await response.json();ordersNode.innerHTML=orders.map(order=>{const index=statuses.indexOf(order.status);const contact=order.customer_name?`${order.customer_name} · ${order.customer_phone}`:'Customer details unavailable';return `<article class="order"><div class="tag">Table ${order.table_no} · Order #${order.id}</div><h2>${order.status}</h2><div class="customer">${contact}</div><ul>${order.items.map(item=>`<li>${item.quantity} x ${item.name}</li>`).join('')}</ul><div class="actions">${statuses.slice(index+1).map((status,offset)=>`<button data-id="${order.id}" data-status="${status}">${order.status==='confirmed'&&offset===0?'Confirm order':status}</button>`).join('')}</div></article>`;}).join('')||'<p class="empty">No orders yet.</p>';}
async function updateStatus(button){const response=await fetch(`/api/orders/${button.dataset.id}/status`,{method:'PATCH',headers:{'content-type':'application/json','x-admin-key':keyNode.value},body:JSON.stringify({status:button.dataset.status})});if(response.status===401){alert('Invalid admin key');return;}load();}
document.getElementById('refresh').onclick=load; document.addEventListener('click',event=>{const button=event.target.closest('[data-id]');if(button)updateStatus(button);}); load(); setInterval(load,5000);
</script></body></html>
