<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TableBite QR Codes</title><style>body{margin:0;padding:24px;background:#f3eee4;color:#123b2e;font:16px system-ui}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px}.card{padding:16px;text-align:center;background:#fffdf8;border:1px solid #d8d0c1;border-radius:12px}.card img{width:100%;max-width:220px;display:block;margin:auto}.card b{display:block;margin-top:10px}</style></head><body><h1>TableBite QR codes</h1><div class="grid"><article class="card"><img src="/qr-codes/restaurant.png" alt="Restaurant QR code"><b>One QR for all tables</b><a href="/qr-codes/restaurant.png" download>Download</a></article></div><h2>Optional table-specific codes</h2><div class="grid" id="codes"></div><script>document.getElementById('codes').innerHTML=Array.from({length:10},(_,i)=>`<article class="card"><img src="/qr-codes/table-${i+1}.png" alt="QR code for Table ${i+1}"><b>Table ${i+1}</b><a href="/qr-codes/table-${i+1}.png" download>Download</a></article>`).join('');</script></body></html>
