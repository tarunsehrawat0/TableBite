</main><script>
let table = Number(new URLSearchParams(location.search).get('table')) || 7; const screens = { details:'detailsScreen', menu:'menuScreen', cart:'cartScreen', payment:'paymentScreen', status:'statusScreen' }; const steps=['confirmed','received','preparing','ready','served']; const statusMessages={confirmed:'Your order is confirmed and waiting for the kitchen.',received:'The kitchen has confirmed your order.',preparing:'Your food is being prepared now.',ready:'Your order is ready and coming to your table.',served:'Your order has been served. Enjoy your meal!'}; const itemImages={1:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=160&q=80',2:'https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=160&q=80',3:'https://images.unsplash.com/photo-1586190848861-99aa4e171e90?auto=format&fit=crop&w=160&q=80',4:'https://images.unsplash.com/photo-1606755962773-d324e0a13086?auto=format&fit=crop&w=160&q=80',5:'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=160&q=80',6:'https://images.unsplash.com/photo-1481070414801-51fd732d7184?auto=format&fit=crop&w=160&q=80',7:'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=160&q=80',8:'https://images.unsplash.com/photo-1553909489-cd47e0ef937f?auto=format&fit=crop&w=160&q=80',9:'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=160&q=80',10:'https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=160&q=80',11:'https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=160&q=80',12:'https://images.unsplash.com/photo-1626700051175-6818013e1d4f?auto=format&fit=crop&w=160&q=80',13:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=160&q=80',14:'https://images.unsplash.com/photo-1630384060421-cb20d0e0649d?auto=format&fit=crop&w=160&q=80',15:'https://images.unsplash.com/photo-1585109649139-366815a0d713?auto=format&fit=crop&w=160&q=80',16:'https://images.unsplash.com/photo-1518013431117-ebd18c4209c9?auto=format&fit=crop&w=160&q=80'}; const imageMap={Burger:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=160&q=80',Sandwich:'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=160&q=80','Healthy Wraps':'https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=160&q=80',Fries:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=160&q=80',Pasta:'https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=160&q=80',Maggie:'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=160&q=80',Corns:'https://images.unsplash.com/photo-1551754655-cd27e38d2076?auto=format&fit=crop&w=160&q=80',Noodles:'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=160&q=80',Rice:'https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=160&q=80',"Chilli's":'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=160&q=80',Snacks:'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=160&q=80',Coffees:'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=160&q=80',Shakes:'https://images.unsplash.com/photo-1572490122747-3968b75cc699?auto=format&fit=crop&w=160&q=80',Mojitos:'https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=160&q=80'}; let menu=[], category='All', cart=new Map(), payment='upi', order, poll, customer={name:'',phone:''};
const $=id=>document.getElementById(id), money=n=>`₹${Number(n).toFixed(2)}`; const total=()=>[...cart.values()].reduce((sum,item)=>sum+item.price*item.quantity,0); const count=()=>[...cart.values()].reduce((sum,item)=>sum+item.quantity,0); let search='';
function go(screen){Object.values(screens).forEach(id=>$(id).classList.remove('active')); $(screens[screen]).classList.add('active'); if(screen==='menu')renderMenu(); if(screen==='cart')renderCart(); if(screen==='payment')$('paymentTotal').textContent=`Table ${table} · Total ${money(total()*1.05)}`;}
function toast(message){const node=$('toast');node.textContent=message;node.classList.add('show');clearTimeout(node.timer);node.timer=setTimeout(()=>node.classList.remove('show'),2200);}
function renderCategories(){const categories=['All',...new Set(menu.map(item=>item.cat))];$('categories').innerHTML=categories.map(item=>`<button class="${item===category?'active':''}" data-category="${item}">${item}</button>`).join('');}
const imageVariants={Pasta:['https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=160&q=80'],Maggie:['https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1557872943-16a5ac26437e?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1562565652-a0d8f0c59eb4?auto=format&fit=crop&w=160&q=80'],Noodles:['https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1557872943-16a5ac26437e?auto=format&fit=crop&w=160&q=80'],Corns:['https://images.unsplash.com/photo-1551754655-cd27e38d2076?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1603046891744-1f76eb10aecf?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1566843972142-a7fcb70de55a?auto=format&fit=crop&w=160&q=80'],Rice:['https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1516684669134-cec9b3b7ed0?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1536304993881-ff6e9eefa2a6?auto=format&fit=crop&w=160&q=80'],"Chilli's":['https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=160&q=80'],Snacks:['https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1534790566855-4cb788d389ec?auto=format&fit=crop&w=160&q=80'],Coffees:['https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=160&q=80'],Shakes:['https://images.unsplash.com/photo-1572490122747-3968b75cc699?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1553787499-6f9133860278?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1568901839119-6e3cc135b7a1?auto=format&fit=crop&w=160&q=80'],Mojitos:['https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=160&q=80','https://images.unsplash.com/photo-1513558161293-ccaf765ed2fd?auto=format&fit=crop&w=160&q=80']};
function imageFor(item){if(item.cat==="Chilli's")return imageMap[item.cat];if(item.cat==='Snacks')return imageMap[item.cat];const variants=imageVariants[item.cat];return itemImages[item.id]||(variants&&variants[item.id%variants.length])||imageMap[item.cat]||imageMap.Snacks;}
function renderMenu(){renderCategories();const visible=menu.filter(item=>(category==='All'||item.cat===category)&&(!search||`${item.name} ${item.cat}`.toLowerCase().includes(search)));$('menuList').innerHTML=visible.map(item=>{const quantity=cart.get(item.id)?.quantity||1;const fallback=imageMap[item.cat]||imageMap.Snacks;return `<article class="food"><img class="food-image" src="${imageFor(item)}" alt="${item.name}" onerror="this.onerror=null;this.src='${fallback}'"><div class="food-main"><div class="food-name">${item.name}</div><div class="food-desc">${item.cat} · Freshly prepared</div><div class="food-bottom"><span>${money(item.price)}</span><span class="quantity"><button data-quantity="${item.id}" data-delta="-1">−</button><span>${quantity}</span><button data-quantity="${item.id}" data-delta="1">+</button><button class="add" data-add="${item.id}">Add</button></span></div></div></article>`;}).join('');const n=count();$('cartButton').disabled=!n;$('cartButton').textContent=n?`View cart · ${n} item${n>1?'s':''} · ${money(total())}`:'Cart is empty';}
function renderCart(){const items=[...cart.values()];$('confirmButton').disabled=!items.length;$('cartList').innerHTML=items.length?items.map(item=>`<div class="cart-row"><span class="name"><b>${item.name}</b><br><span class="sub">${money(item.price)} each</span><br><span class="remove" data-remove="${item.id}">Remove</span></span><span class="quantity"><button data-cart-quantity="${item.id}" data-delta="-1">−</button><span>${item.quantity}</span><button data-cart-quantity="${item.id}" data-delta="1">+</button></span></div>`).join('')+`<div class="total"><div><span>Subtotal</span><span>${money(total())}</span></div><div><span>Tax (5%)</span><span>${money(total()*.05)}</span></div><div class="grand"><span>Total</span><span>${money(total()*1.05)}</span></div></div>`:'<div class="sub empty">Your cart is empty. Add something from the menu.</div>';}
function changeQuantity(id,delta){const item=cart.get(id);if(item){item.quantity+=delta;if(item.quantity<1)cart.delete(id);}renderMenu();renderCart();}
async function loadMenu(){const response=await fetch('/api/menu');if(!response.ok)throw new Error('Menu unavailable');menu=await response.json();renderMenu();}
async function placeOrder(){if(!customer.name||!customer.phone){toast('Add your details before ordering');go('details');return;}const items=[...cart.values()];const response=await fetch('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({customer_name:customer.name,customer_phone:customer.phone,table_no:table,items,total:total()*1.05,payment_method:payment})});if(!response.ok){toast('Could not place order');return;}order=await response.json();renderStatus(order);go('status');clearInterval(poll);poll=setInterval(refreshStatus,3000);}
function renderStatus(current){const index=steps.indexOf(current.status);$('statusTable').textContent=`Table ${current.table_no}`;$('statusHeading').textContent=current.customer_name?`Thanks, ${current.customer_name}! We got your order`:'Thanks! We got your order';$('orderLabel').textContent=`Order A-${current.id} · Paid by ${String(current.payment_method).toUpperCase()}`;$('statusSteps').innerHTML=steps.map((step,i)=>`<div class="status ${i<index?'done':i===index?'current':''}"><span class="status-dot">${i<index?'✓':''}</span><span><b>${step[0].toUpperCase()+step.slice(1)}</b><br><span class="sub">${i===index?statusMessages[step]:' '}</span></span></div>`).join('');const rows=(current.items||[]).map(item=>`<div class="receipt-row"><span>${item.quantity} × ${item.name}</span><span>${money(item.price*item.quantity)}</span></div>`).join('');$('receipt').innerHTML=`<div class="receipt-title">Your order</div>${rows}<div class="receipt-paid"><span>Paid</span><span>${money(current.total)}</span></div>`;}
async function refreshStatus(){if(!order)return;const response=await fetch(`/api/orders/${order.id}`);if(response.ok){order=await response.json();renderStatus(order);}}
for(let number=1;number<=10;number++)$('tableSelector').insertAdjacentHTML('beforeend',`<option value="${number}">Table ${number}</option>`);$('tableSelector').value=String(table);$('detailsButton').onclick=()=>{const name=$('customerName').value.trim(),phone=$('customerPhone').value.trim(),selectedTable=Number($('tableSelector').value);$('nameError').textContent=name?'':'Enter your name';$('phoneError').textContent=/^\d{10}$/.test(phone)?'':'Enter a 10-digit mobile number';$('tableError').textContent=selectedTable?'':'Choose your table number';if(!name||!/^\d{10}$/.test(phone)||!selectedTable)return;customer={name,phone};table=selectedTable;$('menuTable').textContent=`Table ${table}`;go('menu');toast(`Welcome, ${name}`);};$('menuSearch').oninput=event=>{search=event.target.value.trim().toLowerCase();renderMenu();};$('callWaiter').onclick=()=>toast(`Waiter called for Table ${table}`);$('cartButton').onclick=()=>go('cart');$('confirmButton').onclick=()=>go('payment');$('payButton').onclick=placeOrder;$('startOver').onclick=()=>{clearInterval(poll);cart.clear();category='All';search='';customer={name:'',phone:''};$('customerName').value='';$('customerPhone').value='';go('menu');};document.addEventListener('click',event=>{const target=event.target.closest('[data-category],[data-add],[data-quantity],[data-cart-quantity],[data-remove],[data-go],[data-payment]');if(!target)return;const data=target.dataset;if(data.category){category=data.category;renderMenu();}else if(data.add){const item=menu.find(entry=>entry.id===Number(data.add));const existing=cart.get(item.id)||{...item,quantity:0};existing.quantity++;cart.set(item.id,existing);renderMenu();toast('Added to cart');}else if(data.quantity)changeQuantity(Number(data.quantity),Number(data.delta));else if(data.cartQuantity)changeQuantity(Number(data.cartQuantity),Number(data.delta));else if(data.remove){cart.delete(Number(data.remove));renderCart();renderMenu();}else if(data.go)go(data.go);else if(data.payment){payment=data.payment;document.querySelectorAll('[data-payment]').forEach(button=>button.classList.toggle('selected',button===target));}});loadMenu().catch(()=>{$('menuList').innerHTML='<div class="sub empty">Menu unavailable. Is the backend running?</div>';});
