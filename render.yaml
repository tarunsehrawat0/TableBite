services:
  - type: web
    name: tablebite-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DB_PATH
        value: /tmp/tablebite.db
      - key: ADMIN_KEY
        generateValue: true

  - type: web
    name: tablebite-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_HOST
        value: tablebite-backend.onrender.com
      - key: BACKEND_PORT
        value: "80"
